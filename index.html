<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Chat Interno - Equipe</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; display:flex; height:100vh }
.sidebar { width:300px; background:#020617; padding:15px; overflow:auto }
.chat { flex:1; display:flex; flex-direction:column }
.item { padding:10px; border-bottom:1px solid #1e293b; cursor:pointer }
.item:hover { background:#1e293b }
.badge { background:red; border-radius:50%; padding:3px 7px; font-size:12px; float:right }
</style>
</head>
<body>

<div class="sidebar">
<h3>Grupos</h3>
<div id="grupos"></div>

<h3>Contatos</h3>
<div id="contatos"></div>
</div>

<div class="chat">
<div id="topo">Selecione uma conversa</div>
<div id="mensagens" style="flex:1; overflow:auto"></div>
<input id="msg" placeholder="Digite...">
<button onclick="enviar()">Enviar</button>
</div>

<script>
const socket = io();
let atual = null;
let tipoAtual = null;
let unread = {};
let lastTime = {};

function atualizarTitulo(){
 let total = Object.values(unread).reduce((a,b)=>a+b,0);
 document.title = total>0 ? `(${total}) Chat Interno - Equipe` : 'Chat Interno - Equipe';
}

function ordenar(lista, tipo){
 return lista.sort((a,b)=>{
  return (lastTime[b.id]||0)-(lastTime[a.id]||0);
 });
}

function renderGrupos(lista){
 let div = document.getElementById('grupos');
 div.innerHTML='';
 ordenar(lista,'grupo').forEach(g=>{
  let el = document.createElement('div');
  el.className='item';
  el.innerHTML = g.nome + (unread['g'+g.id]?`<span class='badge'>${unread['g'+g.id]}</span>`:'');
  el.onclick=()=>abrir('grupo',g.id);
  div.appendChild(el);
 });
}

function renderContatos(lista){
 let div = document.getElementById('contatos');
 div.innerHTML='';
 ordenar(lista,'privado').forEach(c=>{
  let el = document.createElement('div');
  el.className='item';
  el.innerHTML = c.nome + (unread['p'+c.id]?`<span class='badge'>${unread['p'+c.id]}</span>`:'');
  el.onclick=()=>abrir('privado',c.id);
  div.appendChild(el);
 });
}

function abrir(tipo,id){
 atual=id; tipoAtual=tipo;
 unread[(tipo==='grupo'?'g':'p')+id]=0;
 atualizarTitulo();
}

function enviar(){
 let texto=document.getElementById('msg').value;
 if(!texto)return;
 socket.emit('mensagem',{tipo:tipoAtual,id:atual,texto});
 document.getElementById('msg').value='';
}

socket.on('grupos',data=>renderGrupos(data));
socket.on('usuarios',data=>renderContatos(data));

socket.on('mensagem',data=>{
 let key=(data.tipo==='grupo'?'g':'p')+data.id;
 lastTime[data.id]=Date.now();
 if(atual!==data.id){
  unread[key]=(unread[key]||0)+1;
 }
 atualizarTitulo();
});
</script>

</body>
</html>
